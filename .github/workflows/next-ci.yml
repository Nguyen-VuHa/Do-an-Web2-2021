name: CI/CD Workflow

on:
  push:
    branches:
      - next-ci # Chạy workflow khi có thay đổi ở nhánh auto-ci
  pull_request:
    branches:
      - next-ci # Chạy workflow khi có PR tới nhánh auto-ci

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker
        run: |
          echo "{\"insecure-registries\":[\"${{ secrets.REGISTRY_URL }}\"]}" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info  # Kiểm tra thông tin Docker
      # Check out mã nguồn
      - name: Checkout code
        uses: actions/checkout@v3

        # Tạo file .env cho React và NextJS từ GitHub Secrets
      - name: Create .env file for React and Next.js
        run: |
          # Tạo file .env cho Next.js
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" >> .env
          echo "NEXT_PUBLIC_FRONT_END_URL=${{ secrets.NEXT_PUBLIC_FRONT_END_URL }}" >> .env
          echo "NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}" >> .env
          echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> .env

      # Build và Push image cho Frontend (NextJS)
      - name: Build and push NextJS image
        working-directory: ./nextjs-client # Đảm bảo vào đúng thư mục dự án NextJS
        run: |
          docker build --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
                       --build-arg NEXT_PUBLIC_FRONT_END_URL=${{ secrets.NEXT_PUBLIC_FRONT_END_URL }} \
                       --build-arg NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }} \
                       --build-arg NODE_ENV=${{ secrets.NODE_ENV }} \
                       -t ${{ secrets.REGISTRY_URL }}/${{ secrets.IMAGE_NAME }}-next-client:${{ github.sha }} .
          docker push ${{ secrets.REGISTRY_URL }}/${{ secrets.IMAGE_NAME }}-next-client:${{ github.sha }}

      - name: Send Signature Auto Run
        run: |
          curl -X GET "${{ secrets.WEBHOOK_CD_URL }}/service-client?_image=${{ secrets.REGISTRY_CD }}/${{ secrets.IMAGE_NAME }}-next-client:${{ github.sha }}&_token=${{ secrets.TOKEN_BUILD_MOVIE_CLIENT }}"
